# Coordinates for sample_images/対局例 screenshots.
# These observer/replay screenshots have the board and hands shifted upward.
board:
  top_left: [7, 288]
  width: 570
  height: 621

recognition:
  pieces_dir: templates/pieces
  hand_digits_dir: templates/hand_digits
  piece_threshold: 0.72
  hand_piece_threshold: 0.70
  hand_presence_threshold: 0.45
  digit_threshold: 0.70
  empty_threshold: 0.30
  match_size: [64, 64]
  cell_crop_margin: 2
  slot_crop_margin: 0
  mode: color

